location = /tools/FoldStudio { return 308 /tools/FoldStudio/; }
location = /FoldStudio { return 301 https://etienne.design/tools/FoldStudio/; }
location ^~ /tools/FoldStudio/ {
    alias /srv/foldstudio/web/dist/;
    index index.html;
    try_files $uri $uri/ /tools/FoldStudio/index.html;
    autoindex off;
    expires -1;
    etag on;
    limit_except GET HEAD { deny all; }
}
